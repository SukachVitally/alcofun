server:
  port: 7080

spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/test_alcosearch
    username: user
    password: password
  thymeleaf:
    cache: false
  flyway:
    url: jdbc:postgresql://localhost:5432/test_alcosearch
    user: user
    password: password
    locations: classpath:db/migration

app:
  image-service:
    base-url: http://localhost:7080/images/
  filesystem-storage:
    path: ./src/main/resources/static/images/
  provider:
    list:
      - ALCOMAG
#      - ROZETKA
#      - OKWINE
#      - MAUDAU

logging:
  level:
    io.r2dbc.postgresql.QUERY: INFO # for queries
    io.r2dbc.postgresql.PARAM: INFO # for parameters
