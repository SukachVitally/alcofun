server:
  port: 7080

spring:
  elasticsearch:
    uris: "elasticsearch-service.prod:9200"
  r2dbc:
    url: r2dbc:postgresql://postgres-service.prod:5432/alcosearch
    username: user
    password: password
  thymeleaf:
    cache: false
  flyway:
    url: jdbc:postgresql://postgres-service.prod:5432/alcosearch
    user: user
    password: password
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: kafka1-service.prod:8097,kafka2-service.prod:8098
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: product-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            use:
              type:
                headers: false
            value:
              default:
                type: com.alco.searchapp.provider.dto.ProductPageDto
  config:
    import:
      - providers/alcomag.yaml
      - providers/rozetka.yaml
      - providers/okwine.yaml
      - product/product-config.yaml

app:
  image-service:
    base-url: /images/
    storage: S3
    bucket: images
  best-price:
    min-percent: 10
  product:
    search:
      index: products1
  provider-topic:
    replication-factor: 2
    partitions: 2
