server:
  port: 7080

spring:
  elasticsearch:
    uris: "elasticsearch-service.prod:9200"
  r2dbc:
    url: r2dbc:postgresql://postgres-service.prod:5432/alcosearch
    username: user
    password: password
  thymeleaf:
    cache: false
  flyway:
    url: jdbc:postgresql://postgres-service.prod:5432/alcosearch
    user: user
    password: password
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: kafka1-service.prod:8097,kafka2-service.prod:8098

  config:
    import:
      - providers/alcomag.yaml
      - providers/rozetka.yaml
      - providers/okwine.yaml
      - providers/maudau.yaml
      - providers/fozzy.yaml
      - product/product-config.yaml
      - product/pubsub-config.yaml

app:
  image-service:
    base-url: http://alcoprice.com.ua/images/
    storage: S3
    bucket: images
  best-price:
    min-percent: 10
  search:
    product: products1
    category: category1
    characteristic: characteristic1
  provider-topic:
    replication-factor: 2
    partitions: 2
  seo:
    baseUrl: https://alcoprice.com.ua
