spring:
  cloud:
    function:
      definition: alcomagSupplier;okwineSupplier;fozzySupplier;alcomagConsumer;okwineConsumer;fozzyConsumer
    stream:
      default-binder: kafka
      kafka:
        binder:
          auto-create-topics: true
          replication-factor: 2
        bindings:
          alcomagConsumer-in-0:
            consumer:
              ack-mode: record
          okwineConsumer-in-0:
            consumer:
              ack-mode: record
          fozzyConsumer-in-0:
            consumer:
              ack-mode: record

      bindings:
        alcomagSupplier-out-0:
          destination: product-alcomag
          binder: kafka
        okwineSupplier-out-0:
          destination: product-okwine
          binder: kafka
        fozzySupplier-out-0:
          destination: product-fozzy
          binder: kafka
        alcomagConsumer-in-0:
          destination: product-alcomag
          binder: kafka
          group: alcomag-consumer
        okwineConsumer-in-0:
          destination: product-okwine
          binder: kafka
          group: okwine-consumer
        fozzyConsumer-in-0:
          destination: product-fozzy
          binder: kafka
          group: fozzy-consumer

app:
  product:
    subscriber:
      enabled: true
      providers:
        ALCOMAG:
          delay-sec: 70
#        ROZETKA:
#          delay-sec: 7
        OKWINE:
          delay-sec: 40
        FOZZY:
          delay-sec: 30
    producer:
      enabled: true
      cron: 0 0 0 * * ?
      providers:
        - ALCOMAG
#        - ROZETKA // broken
        - OKWINE
        - FOZZY
    #      - MAUDAU // broken
    refresher:
      enabled: true
      cron: 0 0 23 * * ?