spring:
  cloud:
    function:
      definition: productPageSupplier;alcomagConsumer;rozetkaConsumer;okwineConsumer;fozzyConsumer
    stream:
      default-binder: kafka
      kafka:
        binder:
          auto-create-topics: true
          replication-factor: 2
        bindings:
          alcomagConsumer-in-0:
            consumer:
              ack-mode: record
          rozetkaConsumer-in-0:
            consumer:
              ack-mode: record
          okwineConsumer-in-0:
            consumer:
              ack-mode: record
          fozzyConsumer-in-0:
            consumer:
              ack-mode: record

      bindings:
        productPageSupplier-out-0:
          destination: product-topic
          binder: kafka
        alcomagConsumer-in-0:
          destination: product-topic
          binder: kafka
          group: alcomag-consumer
        rozetkaConsumer-in-0:
          destination: product-topic
          binder: kafka
          group: rozetka-consumer
        okwineConsumer-in-0:
          destination: product-topic
          binder: kafka
          group: okwine-consumer
        fozzyConsumer-in-0:
          destination: product-topic
          binder: kafka
          group: fozzy-consumer

app:
  product:
    subscriber:
      enabled: true
      providers:
        ALCOMAG:
          delay-sec: 70
        ROZETKA:
          delay-sec: 7
        OKWINE:
          delay-sec: 40
        FOZZY:
          delay-sec: 30
    producer:
      enabled: true
      cron: 0 0 0 * * ?
      providers:
        - ALCOMAG
#        - ROZETKA //
        - OKWINE
        - FOZZY
    #      - MAUDAU // broken
    refresher:
      enabled: true
      cron: 0 0 23 * * ?