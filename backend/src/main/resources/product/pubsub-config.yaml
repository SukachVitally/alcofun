spring:
  cloud:
    function:
      definition: productPageSupplier;alcomagConsumer;rozetkaConsumer;okwineConsumer
    stream:
      default-binder: kafka
      kafka:
        binder:
          auto-create-topics: true
          replication-factor: 2
        bindings:
          alcomagConsumer-in-0:
            consumer:
              ack-mode: record
          rozetkaConsumer-in-0:

            consumer:
              ack-mode: record
          okwineConsumer-in-0:
            consumer:
              ack-mode: record

      bindings:
        productPageSupplier-out-0:
          destination: product-topic
          binder: kafka
        alcomagConsumer-in-0:
          destination: product-topic
          binder: kafka
          group: alcomag-consumer
        rozetkaConsumer-in-0:
          destination: product-topic
          binder: kafka
          group: rozetka-consumer
        okwineConsumer-in-0:
          destination: product-topic
          binder: kafka
          group: okwine-consumer

app:
  product:
    subscriber:
      enabled: true
      providers:
        ALCOMAG:
          delay-sec: 30
        ROZETKA:
          delay-sec: 5
        OKWINE:
          delay-sec: 20
    producer:
      enabled: true
      cron: 0 0 8 * * ?
      providers:
        - ALCOMAG
        - ROZETKA
        - OKWINE
    #      - MAUDAU // broken
    refresher:
      enabled: true
      cron: 0 0 7 * * ?