server:
  port: 7080

spring:
  elasticsearch:
    uris: "localhost:19200"
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/alcosearch
    username: user
    password: password
  thymeleaf:
    cache: false
  flyway:
    url: jdbc:postgresql://localhost:5432/alcosearch
    user: user
    password: password
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:8097,localhost:8098
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: product-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            use:
              type:
                headers: false
            value:
              default:
                type: com.alco.searchapp.provider.dto.ProductPageDto
  config:
    import:
      - providers/alcomag.yaml
      - providers/rozetka.yaml
      - providers/okwine.yaml

app:
  image-service:
    base-url: http://localhost:19000/images/
    storage: MINIO
    bucket: images

  provider:
    list:
#      - ALCOMAG
#      - ROZETKA
      - OKWINE
#      - MAUDAU // broken
  product:
    subscriber:
      enabled: true
      delay-sec: 5
    producer:
      enabled: true
  queue:
    product-topic: products
