server:
  port: 7080

spring:
  elasticsearch:
    uris: "localhost:19200"
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/alcosearch
    username: user
    password: password
  thymeleaf:
    cache: false
  flyway:
    url: jdbc:postgresql://localhost:5432/alcosearch
    user: user
    password: password
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:8097,localhost:8098
  config:
    import:
      - providers/alcomag.yaml
      - providers/rozetka.yaml
      - providers/okwine.yaml
      - product/product-config.yaml
      - product/pubsub-config.yaml

app:
  image-service:
    base-url: http://localhost:19000/images/
    storage: S3
    bucket: images
  product:
    search:
      index: products1
  provider-topic:
    replication-factor: 2
    partitions: 2
  seo:
    baseUrl: https://alcoprice.com.ua
