<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light" th:replace="~{fragments/navigation :: navigation}"></nav>
<!-- Main Content with Sidebar -->
<div class="container-fluid mt-5">
    <div class="row">
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar" th:replace="~{fragments/navigation :: sidebar}"></nav>
        <!-- Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div th:replace="~{fragments/carousel :: carousel}"></div>
            <h3 th:text="${product.name}"></h3>
            <p th:text="${product.description}"></p>
            <p>Best price is <b th:text="${product.price}"></b></p>
            <div class="row mb-3 text-center">
                <div class="col-2 themed-grid-col" th:each="provider : ${product.providers}">
                    <a th:href="${provider.link}" th:text="${provider.providerName} + ': ' + ${provider.price}"></a>
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
