<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body>
    <nav th:replace="~{fragments/navigation :: navigation}"></nav>
    <h1 th:text="${product.getName()}"></h1>
    <div>EAN <b th:text="${product.getEan()}"></b></div>
    <img th:attr="src=${product.getImageUrls().get(0)}" th:unless="${#lists.isEmpty(product.getImageUrls())}"/>
    <div>Категорія <b th:text="${product.categoryName}"></b></div>
    <p th:text="${product.description}"></p>
    <div>Ціна <b th:text="${product.price}"></b></div>
</body>
</html>
