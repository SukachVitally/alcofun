<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light" th:fragment="navigation">
    <div class="container">
        <a class="navbar-brand" href="#">AlcoFun</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
            </ul>
        </div>
        <form class="d-flex" action="/product/" method="get">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" name="search">
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
    </div>
</nav>

<nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar" th:fragment="sidebar">
    <div class="position-sticky">
        <ul class="nav flex-column" th:each="category : ${categories}">
            <li class="nav-item">
                <a class="nav-link" th:href="'/product/?category=' + ${category.id}" th:text="${category.name}"></a>
            </li>
        </ul>
    </div>
</nav>
