<div class="col-md-4 mb-4" th:fragment="product-list-item">
    <div class="card">
        <img th:src="${product.imageUrl}" class="card-img-top" th:alt="${product.name}">
        <div class="card-body">
            <h5 class="card-title" th:text="${product.name}"></h5>
            <p class="card-text">Best price is <b th:text="${product.price}"></b></p>
            <a th:href="'/product/' + ${product.id}" class="btn btn-primary">View</a>
        </div>
    </div>
</div>
