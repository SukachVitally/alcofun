<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head}" th:with="title=${title}, description=${description}" ></head>
<body>
    <nav th:replace="~{fragments/navigation :: navigation}"></nav>
    <h1 th:text="${description}"></h1>
    <h2>Доступні продукти</h2>
    <ul>
        <li th:each="product : ${products}">
            <h3 th:text="${product.getName()}"></h3>
            <div>ean: <b th:text="${product.getEan()}"></b></div>

            <img th:attr="src=${product.getImageUrls().get(0)}" th:unless="${#lists.isEmpty(product.getImageUrls())}"/>
            <a th:attr="href='/products/' + ${product.id}">view</a>
        </li>
    </ul>
</body>
</html>
