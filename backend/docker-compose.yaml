version: "3.8"
services:
  database:
    image: postgres
    container_name: database
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: alcosearch
    volumes:
      - database_data:/var/lib/postgresql/data

volumes:
  database_data:
  pgadmin_data: