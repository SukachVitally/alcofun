[supervisord]
logfile = /tmp/supervisord.log
logfile_maxbytes = 50MB
logfile_backups=10
loglevel = info
pidfile = /tmp/supervisord.pid
nodaemon = false
umask = 022
user = ec2-user

[program:application]
process_name=application
numprocs=1
command=java -Dspring.profiles.active=prod -jar /home/ec2-user/searchapp.jar
logfile=/home/ec2-user/searchapp.log
redirect_stderr=true
stdout_logfile=/home/ec2-user/searchapp-out.log
stderr_logfile=/home/ec2-user/searchapp-error.log
startsecs=3
startretries=3
user=ec2-user