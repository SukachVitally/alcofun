---
- name: Install python3-pip package
  become: true
  package:
    name: python3-pip
    state: present
- name: Install supervisor
  become: true
  pip:
    name: "supervisor"
    state: present
  when: ansible_os_family == 'RedHat'
- name: Copy supervisor config
  become: true
  copy:
    src: ./resources/supervisord.conf
    dest: /usr/local/etc/supervisord.conf
    mode: 0644
  notify: "restart_supervisor"
- name: Register supervisord in systemd
  become: true
  copy:
    src: ../resources/supervisord.service
    dest: /etc/systemd/system/supervisord.service
    mode: 0644
  notify: "restart_supervisor"
