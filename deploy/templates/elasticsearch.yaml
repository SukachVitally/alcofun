---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: elasticsearch-pv
  namespace: {{ .Values.namespace }}
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path:  {{ .Values.volumeDir  }}/elasticsearch
  claimRef:
    name: elasticsearch-pvc
    namespace: {{ .Values.namespace }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-pvc
  namespace: {{ .Values.namespace }}
spec:
  volumeName: elasticsearch-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      volumes:
        - name:  elasticsearch-volume
          persistentVolumeClaim:
            claimName: elasticsearch-pvc
      containers:
      - name: elasticsearch
        image: {{ .Values.elasticsearch.image }}
        env:
          - name: xpack.security.enabled
            value: 'false'
          - name: discovery.type
            value: single-node
          - name: ES_JAVA_OPTS
            value: -Xms3g -Xmx3g
        volumeMounts:
        - name: elasticsearch-volume
          mountPath: /usr/share/elasticsearch/data
        ports:
        - containerPort: {{ .Values.elasticsearch.containerPort }}

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: elasticsearch
  ports:
    - protocol: TCP
      name: elasticsearch
      port: {{ .Values.elasticsearch.containerPort }}
      targetPort: {{ .Values.elasticsearch.containerPort }}
      nodePort: {{ .Values.elasticsearch.nodePort }}
