---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  namespace: {{ .Values.namespace }}
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.volumeDir }}/postgres
  claimRef:
    name: postgres-pvc
    namespace: prod

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{ .Values.namespace }}
  name: postgres-pvc
spec:
  volumeName: postgres-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace }}
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      volumes:
        - name:  postgres-volume
          persistentVolumeClaim:
            claimName: postgres-pvc
      containers:
      - name: postgres
        image: {{ .Values.postgres.image }}
        env:
          - name: POSTGRES_USER
            value: {{ .Values.postgres.username }}
          - name: POSTGRES_PASSWORD
            value: {{ .Values.postgres.password }}
          - name: POSTGRES_DB
            value: {{ .Values.postgres.database }}
        volumeMounts:
        - name: postgres-volume
          mountPath: /var/lib/postgresql/data
        ports:
        - containerPort: {{ .Values.postgres.containerPort }}

---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace }}
  name: postgres-service
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: {{ .Values.postgres.containerPort }}
      targetPort: {{ .Values.postgres.containerPort }}
      nodePort: {{ .Values.postgres.nodePort }}