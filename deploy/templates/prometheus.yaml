---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Values.namespace }}
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
      - static_configs:
        - targets: []
        scheme: http
        timeout: 10s
        api_version: v1
    scrape_configs:
      - job_name: 'Backend metrics'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        static_configs:
          - targets: ['backend-service:{{ .Values.backend.containerPort }}']
            labels:
              application: 'Alcoprice backend'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace }}
  name: prometheus-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      volumes:
      - name: prometheus-config-volume
        configMap:
          defaultMode: 420
          name: prometheus-config
      containers:
      - name: prometheus
        image: {{ .Values.prometheus.image  }}
        ports:
        - containerPort: {{ .Values.prometheus.containerPort }}
        volumeMounts:
        - name: prometheus-config-volume
          mountPath: /etc/prometheus
        env: 
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: grafana

---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace }}
  name: prometheus-service
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: {{ .Values.prometheus.containerPort }}
      targetPort: {{ .Values.prometheus.containerPort }}
      nodePort: {{ .Values.prometheus.nodePort }}