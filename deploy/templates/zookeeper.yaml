---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace }}
  name: zookeeper-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: {{ .Values.zookeeper.image }}
        env:
        - name: ZOOKEEPER_SERVER_ID
          value: "1"
        - name: ZOOKEEPER_CLIENT_PORT
          value: "{{ .Values.zookeeper.clientContainerPort }}"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        ports:
        - containerPort: {{ .Values.zookeeper.clientContainerPort }}
        - containerPort: 2000

---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace }}
  name: zookeeper-service
spec:
  type: NodePort
  selector:
    app: zookeeper
  ports:
    - protocol: TCP
      name: client
      port: {{ .Values.zookeeper.clientContainerPort }}
      targetPort: {{ .Values.zookeeper.clientContainerPort }}
      nodePort: 31181
    - protocol: TCP
      name: tick-time
      port: 2000
      targetPort: 2000
      nodePort: 31000