---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace }}
  name: kafka-ui-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
      - name: kafka-ui
        image: {{ .Values.kafka_ui.image }}
        env:
        - name: KAFKA_CLUSTERS_0_NAME
          value: local
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: kafka1-service:{{ .Values.kafka1.containerPort }},kafka2-service:{{ .Values.kafka2.containerPort }}
        - name: KAFKA_CLUSTERS_0_ZOOKEEPER
          value: zookeeper-service:{{ .Values.zookeeper.clientContainerPort }}
        ports:
        - containerPort: {{ .Values.kafka_ui.containerPort }}

---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace }}
  name: kafka-ui-service
spec:
  type: NodePort
  selector:
    app: kafka-ui
  ports:
    - protocol: TCP
      port: {{ .Values.kafka_ui.containerPort }}
      targetPort: {{ .Values.kafka_ui.containerPort }}
      nodePort: {{ .Values.kafka_ui.nodePort }}
