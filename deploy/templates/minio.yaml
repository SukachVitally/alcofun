---
apiVersion: v1
kind: PersistentVolume
metadata:
  namespace: {{ .Values.namespace }}
  name: minio-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.volumeDir }}/minio
  claimRef:
    name: minio-pvc
    namespace: {{ .Values.namespace }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{ .Values.namespace }}
  name: minio-pvc
spec:
  volumeName: minio-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace }}
  name: minio-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      volumes:
        - name:  minio-volume
          persistentVolumeClaim:
            claimName: minio-pvc
      containers:
      - name: minio
        image: {{ .Values.minio.image }}
        env:
        - name: MINIO_ROOT_USER
          value: {{ .Values.minio.username }}
        - name: MINIO_ROOT_PASSWORD
          value: {{ .Values.minio.password }}
        command:
        - /bin/bash
        - -c
        args: 
        - minio server /data --console-address :{{ .Values.minio.dashboardContainerPort }}
        volumeMounts:
        - name: minio-volume
          mountPath: /data
        ports:
        - containerPort: {{ .Values.minio.apiContainerPort }}
        - containerPort: {{ .Values.minio.dashboardContainerPort }}
        resources:
          limits:
            cpu: "1"
            memory: "2048Mi"

---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace }}
  name: minio-service
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - protocol: TCP
      name: api
      port: {{ .Values.minio.apiContainerPort }}
      targetPort: {{ .Values.minio.apiContainerPort }}
      nodePort: {{ .Values.minio.apiNodePort }}
    - protocol: TCP
      name: dashboard
      port: {{ .Values.minio.dashboardContainerPort }}
      targetPort: {{ .Values.minio.dashboardContainerPort }}
      nodePort: {{ .Values.minio.dashboardNodePort }}
