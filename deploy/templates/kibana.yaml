---
apiVersion: v1
kind: PersistentVolume
metadata:
  namespace: {{ .Values.namespace }}
  name: kibana-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.volumeDir }}/kibana 
  claimRef:
    name: kibana-pvc
    namespace: {{ .Values.namespace }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{ .Values.namespace }}
  name: kibana-pvc
spec:
  volumeName: kibana-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: kibana-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      volumes:
        - name:  kibana-volume
          persistentVolumeClaim:
            claimName: kibana-pvc
      containers:
      - name: kibana
        image: {{ .Values.kibana.image }}
        volumeMounts:
        - name: kibana-volume
          mountPath: /usr/share/kibana/data
        ports: 
        - containerPort: {{ .Values.kibana.containerPort }}
        env: 
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch-service:{{ .Values.elasticsearch.containerPort }}"

---
apiVersion: v1
kind: Service
metadata:
  namespace: prod
  name: kibana-service
spec:
  type: NodePort
  selector:
    app: kibana
  ports:
    - protocol: TCP
      name: kibana
      port: {{ .Values.kibana.containerPort }}
      targetPort: {{ .Values.kibana.containerPort }}
      nodePort: {{ .Values.kibana.nodePort }}