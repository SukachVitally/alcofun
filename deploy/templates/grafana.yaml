---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Values.namespace }}
  name: grafana-config
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus-service:{{ .Values.prometheus.containerPort }}
      isDefault: true
      access: proxy
      editable: true

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-pv
  namespace: {{ .Values.namespace }}
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.volumeDir }}/grafana
  claimRef:
    name: grafana-pvc
    namespace: {{ .Values.namespace }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{ .Values.namespace }}
  name: grafana-pvc
spec:
  volumeName: grafana-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace }}
  name: grafana-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      volumes:
      - name: grafana-config-volume
        configMap:
          defaultMode: 420
          name: grafana-config
      - name:  grafana-volume
        persistentVolumeClaim:
          claimName: grafana-pvc
      containers:
      - name: grafana
        image: {{ .Values.grafana.image  }}
        ports:
        - containerPort: {{ .Values.grafana.containerPort }}
        volumeMounts:
        - name: grafana-config-volume
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-volume
          mountPath: /var/lib/grafana

---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace }}
  name: grafana-service
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: {{ .Values.grafana.containerPort }}
      targetPort: {{ .Values.grafana.containerPort }}
      nodePort: {{ .Values.grafana.nodePort }}