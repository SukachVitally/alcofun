---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace }}
  name: kafka2-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka2
  template:
    metadata:
      labels:
        app: kafka2
    spec:
      containers:
      - name: kafka2
        image: {{ .Values.kafka.image }}
        env:
        - name: KAFKA_BROKER_ID
          value: "2"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-service:{{ .Values.zookeeper.clientContainerPort }}"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
        - name: KAFKA_ADVERTISED_LISTENERS
          value: EXTERNAL://virusx:{{ .Values.kafka2.nodePort }},INTERNAL://kafka2-service:{{ .Values.kafka2.containerPort }}
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: INTERNAL
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "2"
        ports:
        - containerPort: {{ .Values.kafka2.containerPort }}

---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace }}
  name: kafka2-service
spec:
  type: NodePort
  selector:
    app: kafka2
  ports:
    - protocol: TCP
      name: kafka2
      port: {{ .Values.kafka2.containerPort }}
      targetPort: {{ .Values.kafka2.containerPort }}
      nodePort: {{ .Values.kafka2.nodePort }}
