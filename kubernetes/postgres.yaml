---
apiVersion: v1
kind: PersistentVolume
metadata:
  namespace: prod
  name: postgres-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /home/sukach/volumes/postgres
  claimRef:
    name: postgres-pvc
    namespace: prod

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: prod
  name: postgres-pvc
spec:
  volumeName: postgres-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      volumes:
        - name:  postgres-volume
          persistentVolumeClaim:
            claimName: postgres-pvc
      containers:
      - name: postgres
        image: postgres:latest
        env:
          - name: POSTGRES_USER
            value: user
          - name: POSTGRES_PASSWORD
            value: password
          - name: POSTGRES_DB
            value: alcosearch
        volumeMounts:
        - name: postgres-volume
          mountPath: /var/lib/postgresql/data
        ports:
        - containerPort: 5432
        resources:
          limits:
            cpu: "2"
            memory: "2048Mi"

---
apiVersion: v1
kind: Service
metadata:
  namespace: prod
  name: postgres-service
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 31432