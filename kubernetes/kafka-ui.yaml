---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: kafka-ui-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
      - name: kafka-ui
        image: provectuslabs/kafka-ui
        env:
        - name: KAFKA_CLUSTERS_0_NAME
          value: local
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: kafka-service:8097,kafka-service:8098
        - name: KAFKA_CLUSTERS_0_ZOOKEEPER
          value: zookeeper-service:31181
        ports:
        - containerPort: 8080
        resources:
          limits:
            #cpu: "4" # todo: insufficient CPU
            memory: "1000Mi"

---
apiVersion: v1
kind: Service
metadata:
  namespace: prod
  name: kafka-ui-service
spec:
  type: NodePort
  selector:
    app: kafka-ui
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 31080
