---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: $uri
spec:
  tls:
  - hosts:
      - alcofun.co.ua
    secretName: alcofun-co-ua-tls
  rules:
    - host: alcofun.co.ua
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: alcosearch-service
                port:
                  number: 7080
          - path: /images
            pathType: Prefix
            backend:
              service:
                name: minio-service
                port:
                  number: 9000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80