---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: virusx
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: alcosearch-service
                port:
                  number: 7080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80