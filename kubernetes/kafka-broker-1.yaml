---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: kafka1-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka1
  template:
    metadata:
      labels:
        app: kafka1
    spec:
      containers:
      - name: kafka1
        image: confluentinc/cp-kafka:latest
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-service:2181"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
        - name: KAFKA_ADVERTISED_LISTENERS
          value: EXTERNAL://virusx:31097,INTERNAL://kafka1-service:8097
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: INTERNAL
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "2"
        ports:
        - containerPort: 8097
        # resources:
        #   limits:
        #     #cpu: "4" # todo: insufficient CPU
        #     memory: "4000Mi"

---
apiVersion: v1
kind: Service
metadata:
  namespace: prod
  name: kafka1-service
spec:
  type: NodePort
  selector:
    app: kafka1
  ports:
    - protocol: TCP
      name: kafka1
      port: 8097
      targetPort: 8097
      nodePort: 31097
