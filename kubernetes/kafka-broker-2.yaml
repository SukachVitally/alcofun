---
apiVersion: v1
kind: PersistentVolume
metadata:
  namespace: prod
  name: kafka2-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /home/sukach/volumes/kafka2
  claimRef:
    name: kafka2-pvc
    namespace: prod

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: prod
  name: kafka2-pvc
spec:
  volumeName: kafka2-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi



---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: kafka2-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka2
  template:
    metadata:
      labels:
        app: kafka2
    spec:
      volumes:
      - name:  kafka2-volume
        persistentVolumeClaim:
          claimName: kafka2-pvc
      containers:
      - name: kafka2
        image: confluentinc/cp-kafka:latest
        env:
        - name: KAFKA_BROKER_ID
          value: "2"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-service:2181"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
        - name: KAFKA_ADVERTISED_LISTENERS
          value: EXTERNAL://virusx:31098,INTERNAL://kafka2-service:8098
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: INTERNAL
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "2"
        ports:
        - containerPort: 8098
        volumeMounts:
        - name: kafka2-volume
          mountPath: /var/lib/kafka/data
        # resources:
        #   limits:
        #     #cpu: "4" # todo: insufficient CPU
        #     memory: "4000Mi"

---
apiVersion: v1
kind: Service
metadata:
  namespace: prod
  name: kafka2-service
spec:
  type: NodePort
  selector:
    app: kafka2
  ports:
    - protocol: TCP
      name: kafka2
      port: 8098
      targetPort: 8098
      nodePort: 31098
