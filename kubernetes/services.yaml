---
apiVersion: v1
kind: Service
metadata:
  namespace: prod
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  namespace: prod
  name: postgres-service
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 31432
---
apiVersion: v1
kind: Service
metadata:
  namespace: prod
  name: minio-service
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - protocol: TCP
      name: api
      port: 9000
      targetPort: 9000
      nodePort: 31900
    - protocol: TCP
      name: dashboard
      port: 9001
      targetPort: 9001
      nodePort: 31901
