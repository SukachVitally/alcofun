---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "128Mi"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      volumes:
        - name:  postgres-volume
          persistentVolumeClaim:
            claimName: postgres-pvc
      containers:
      - name: postgres
        image: postgres:latest
        env:
          - name: POSTGRES_USER
            value: user
          - name: POSTGRES_PASSWORD
            value: password
          - name: POSTGRES_DB
            value: alcosearch
        volumeMounts:
        - name: postgres-volume
          mountPath: /var/lib/postgresql/data
        ports:
        - containerPort: 5432
        resources:
          limits:
            cpu: "2"
            memory: "2048Mi"
        
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: minio-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      volumes:
        - name:  minio-volume
          persistentVolumeClaim:
            claimName: minio-pvc
      containers:
      - name: minio
        image: quay.io/minio/minio
        env:
        - name: MINIO_ROOT_USER
          value: minioadmin
        - name: MINIO_ROOT_PASSWORD
          value: minioadmin
        command:
        - /bin/bash
        - -c
        args: 
        - minio server /data --console-address :9001
        volumeMounts:
        - name: minio-volume
          mountPath: /data
        ports:
        - containerPort: 9000
        - containerPort: 9001
        resources:
          limits:
            cpu: "1"
            memory: "2048Mi"
