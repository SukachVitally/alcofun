---
apiVersion: v1
kind: PersistentVolume
metadata:
  namespace: prod
  name: elasticsearch-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /home/sukach/volumes/elasticsearch
  claimRef:
    name: elasticsearch-pvc
    namespace: prod

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: prod
  name: elasticsearch-pvc
spec:
  volumeName: elasticsearch-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: elasticsearch-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      volumes:
        - name:  elasticsearch-volume
          persistentVolumeClaim:
            claimName: elasticsearch-pvc
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
        env:
          - name: xpack.security.enabled
            value: 'false'
          - name: discovery.type
            value: single-node
          - name: ES_JAVA_OPTS
            value: -Xms3g -Xmx3g
        volumeMounts:
        - name: elasticsearch-volume
          mountPath: /usr/share/elasticsearch/data
        ports:
        - containerPort: 9200
        resources:
          limits: # todo: not enough CPU for start container)
            memory: 6Gi 

---
apiVersion: v1
kind: Service
metadata:
  namespace: prod
  name: elasticsearch-service
spec:
  type: NodePort
  selector:
    app: elasticsearch
  ports:
    - protocol: TCP
      name: elasticsearch
      port: 9200
      targetPort: 9200
      nodePort: 31200
