---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: alcosearch-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alcosearch
  template:
    metadata:
      labels:
        app: alcosearch
    spec:
      containers:
      - name: alcosearch
        image: localhost:32000/alcosearch:latest
        ports:
        - containerPort: 7080
        # resources:
          # limits:
          #   # cpu: "4"
          #   memory: "10Gi"

---
apiVersion: v1
kind: Service
metadata:
  namespace: prod
  name: alcosearch-service
spec:
  type: NodePort
  selector:
    app: alcosearch
  ports:
    - protocol: TCP
      port: 7080
      targetPort: 7080
      nodePort: 30080