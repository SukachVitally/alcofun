---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: prod
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      volumes:
      - name: frontend-volume
        hostPath:
          path: /home/sukach/volumes/frontend
      containers:
      - name: frontend
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: frontend-volume
          mountPath: /usr/share/nginx/html
        resources:
          limits:
            cpu: "100m"
            memory: "200Mi"

---
apiVersion: v1
kind: Service
metadata:
  namespace: prod
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 31089